<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="anim-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d14"/>
      <stop offset="100%" stop-color="#121822"/>
    </linearGradient>
    <radialGradient id="ball-glow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="40%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </radialGradient>
    <linearGradient id="trail-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.0"/>
      <stop offset="60%" stop-color="#14b8a6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#anim-bg)"/>

  <!-- Background grid with perspective -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="50" y1="400" x2="750" y2="400"/>
    <line x1="100" y1="420" x2="700" y2="420"/>
    <line x1="160" y1="440" x2="640" y2="440"/>
    <line x1="240" y1="460" x2="560" y2="460"/>
    <line x1="150" y1="380" x2="50" y2="480"/>
    <line x1="300" y1="380" x2="250" y2="480"/>
    <line x1="500" y1="380" x2="550" y2="480"/>
    <line x1="650" y1="380" x2="750" y2="480"/>
  </g>

  <!-- Ambient light -->
  <circle cx="560" cy="220" r="200" fill="#14b8a6" opacity="0.1" filter="blur(65px)"/>
  <circle cx="200" cy="180" r="150" fill="#38bdf8" opacity="0.06" filter="blur(55px)"/>

  <!-- Motion trajectory trail -->
  <path d="M 120 320 Q 240 80, 380 260 T 560 210" fill="none" stroke="url(#trail-grad)" stroke-width="4" stroke-dasharray="6 4"/>
  
  <!-- Secondary ghost balls in trajectory -->
  <circle cx="160" cy="240" r="16" fill="#14b8a6" opacity="0.1"/>
  <circle cx="250" cy="120" r="22" fill="#14b8a6" opacity="0.2"/>
  <circle cx="380" cy="260" r="28" fill="#14b8a6" opacity="0.35"/>
  <circle cx="470" cy="225" r="34" fill="#2dd4bf" opacity="0.5"/>

  <!-- Shadow below current ball position -->
  <ellipse cx="560" cy="385" rx="55" ry="12" fill="#05080c" opacity="0.6"/>
  <ellipse cx="560" cy="385" rx="40" ry="8" fill="#14b8a6" opacity="0.15" filter="blur(6px)"/>

  <!-- Main glowing moving ball -->
  <circle cx="560" cy="210" r="48" fill="url(#ball-glow)"/>
  <circle cx="560" cy="210" r="54" fill="none" stroke="#6ee7b7" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="545" cy="190" r="12" fill="#ffffff" opacity="0.4" filter="blur(2px)"/>

  <!-- Code card preview on left side -->
  <rect x="60" y="70" width="310" height="230" rx="12" fill="#111722" fill-opacity="0.9" stroke="#253242" stroke-width="1.2"/>
  <!-- Card Header -->
  <rect x="60" y="70" width="310" height="34" rx="12" fill="#17202e"/>
  <circle cx="80" cy="87" r="4" fill="#f87171"/>
  <circle cx="94" cy="87" r="4" fill="#fbbf24"/>
  <circle cx="108" cy="87" r="4" fill="#34d399"/>
  <text x="125" y="91" fill="#94a3b8" font-family="monospace" font-size="11">animation.css</text>

  <!-- Keyframes snippet -->
  <text x="80" y="130" fill="#ec4899" font-family="monospace" font-size="11">@keyframes <tspan fill="#38bdf8">bounceMove</tspan> {</text>
  <text x="96" y="152" fill="#94a3b8" font-family="monospace" font-size="11">0%, 100% {</text>
  <text x="112" y="174" fill="#2dd4bf" font-family="monospace" font-size="11">  transform: translate(0, 0);</text>
  <text x="96" y="196" fill="#94a3b8" font-family="monospace" font-size="11">}</text>
  <text x="96" y="218" fill="#94a3b8" font-family="monospace" font-size="11">50% {</text>
  <text x="112" y="240" fill="#2dd4bf" font-family="monospace" font-size="11">  transform: translate(320px, -110px);</text>
  <text x="96" y="262" fill="#94a3b8" font-family="monospace" font-size="11">}</text>
  <text x="80" y="284" fill="#ec4899" font-family="monospace" font-size="11">}</text>

  <!-- Floating info pill -->
  <rect x="440" y="80" width="240" height="36" rx="18" fill="#141c28" stroke="#253344" stroke-width="1"/>
  <circle cx="458" cy="98" r="5" fill="#34d399"/>
  <text x="472" y="102" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Pure CSS Keyframe Physics</text>
</svg>
