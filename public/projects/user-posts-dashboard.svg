<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1015"/>
      <stop offset="100%" stop-color="#141a23"/>
    </linearGradient>
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b222d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#12171f" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-grad)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Glow blob -->
  <circle cx="650" cy="120" r="180" fill="#2dd4bf" opacity="0.08" filter="blur(60px)"/>
  <circle cx="200" cy="400" r="140" fill="#38bdf8" opacity="0.06" filter="blur(50px)"/>

  <!-- Top bar / App header -->
  <rect x="40" y="30" width="720" height="48" rx="10" fill="#171e28" stroke="#2a3442" stroke-width="1"/>
  <!-- Window dots -->
  <circle cx="65" cy="54" r="5" fill="#f87171"/>
  <circle cx="82" cy="54" r="5" fill="#fbbf24"/>
  <circle cx="99" cy="54" r="5" fill="#34d399"/>
  <!-- Header title -->
  <text x="130" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">API Users &amp; Posts Dashboard</text>
  <!-- Search bar mockup -->
  <rect x="460" y="40" width="180" height="28" rx="6" fill="#0f141c" stroke="#252e3b" stroke-width="1"/>
  <text x="475" y="58" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Search users or posts...</text>
  <circle cx="685" cy="54" r="14" fill="#2dd4bf" fill-opacity="0.2"/>
  <text x="685" y="58" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MS</text>

  <!-- Sidebar -->
  <rect x="40" y="90" width="160" height="370" rx="10" fill="#141a24" stroke="#263140" stroke-width="1"/>
  <rect x="55" y="110" width="130" height="32" rx="6" fill="#2dd4bf" fill-opacity="0.15" stroke="#2dd4bf" stroke-opacity="0.3"/>
  <text x="75" y="131" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Users Overview</text>
  <rect x="55" y="152" width="130" height="32" rx="6" fill="transparent"/>
  <text x="75" y="173" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Recent Posts</text>
  <rect x="55" y="194" width="130" height="32" rx="6" fill="transparent"/>
  <text x="75" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Analytics</text>
  <rect x="55" y="236" width="130" height="32" rx="6" fill="transparent"/>
  <text x="75" y="257" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">API Config</text>

  <!-- Metric mini cards -->
  <rect x="220" y="90" width="160" height="74" rx="8" fill="url(#card-grad)" stroke="#263140" stroke-width="1"/>
  <text x="236" y="115" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">TOTAL USERS</text>
  <text x="236" y="145" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="22" font-weight="700">1,248</text>
  <text x="330" y="143" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="11" font-weight="600">+12%</text>

  <rect x="395" y="90" width="170" height="74" rx="8" fill="url(#card-grad)" stroke="#263140" stroke-width="1"/>
  <text x="411" y="115" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">POSTS FETCHED</text>
  <text x="411" y="145" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="22" font-weight="700">8,520</text>
  <text x="510" y="143" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">REST API</text>

  <rect x="580" y="90" width="180" height="74" rx="8" fill="url(#card-grad)" stroke="#263140" stroke-width="1"/>
  <text x="596" y="115" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">SYNC STATUS</text>
  <circle cx="602" cy="138" r="4" fill="#2dd4bf"/>
  <text x="614" y="142" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Live Active</text>

  <!-- User Card 1 -->
  <rect x="220" y="180" width="260" height="135" rx="8" fill="url(#card-grad)" stroke="#263140" stroke-width="1"/>
  <circle cx="250" cy="212" r="16" fill="#38bdf8" fill-opacity="0.2"/>
  <text x="250" y="217" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">JD</text>
  <text x="278" y="210" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">John Doe</text>
  <text x="278" y="224" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">@johndoe • ID: #1042</text>
  <rect x="236" y="240" width="228" height="1" fill="#263140"/>
  <text x="236" y="262" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Optimizing UI states with React &amp; Tailwind</text>
  <text x="236" y="280" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">34 min ago • 18 comments</text>

  <!-- User Card 2 -->
  <rect x="500" y="180" width="260" height="135" rx="8" fill="url(#card-grad)" stroke="#263140" stroke-width="1"/>
  <circle cx="530" cy="212" r="16" fill="#2dd4bf" fill-opacity="0.2"/>
  <text x="530" y="217" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">AS</text>
  <text x="558" y="210" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Alice Smith</text>
  <text x="558" y="224" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">@alicesmith • ID: #1043</text>
  <rect x="516" y="240" width="228" height="1" fill="#263140"/>
  <text x="516" y="262" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Dynamic data fetching from public REST endpoints</text>
  <text x="516" y="280" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">1 hr ago • 42 comments</text>

  <!-- User Card 3 (Bottom) -->
  <rect x="220" y="330" width="540" height="130" rx="8" fill="url(#card-grad)" stroke="#263140" stroke-width="1"/>
  <text x="240" y="358" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Latest Feed Activity Stream</text>
  <rect x="240" y="375" width="500" height="32" rx="6" fill="#141a22" stroke="#252f3d" stroke-width="1"/>
  <text x="255" y="395" fill="#2dd4bf" font-family="monospace" font-size="11">GET /api/posts</text>
  <text x="365" y="395" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Successfully loaded 100 posts • 200 OK (38ms)</text>
  <rect x="240" y="415" width="500" height="32" rx="6" fill="#141a22" stroke="#252f3d" stroke-width="1"/>
  <text x="255" y="435" fill="#38bdf8" font-family="monospace" font-size="11">GET /api/users</text>
  <text x="365" y="435" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Loaded user profiles with post association mapping</text>
</svg>
